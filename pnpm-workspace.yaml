packages:
  - packages/*
  - apps/*

overrides:
  '@babel/core@<=7.29.0': 7.29.7
  'esbuild@<=0.24.2': 0.28.1
  'js-yaml@<=4.1.1': 4.2.0
  'lodash@<=4.17.23': 4.18.1
  'shell-quote@>=1.1.0 <=1.8.3': 1.8.4
  'tmp@<0.2.7': 0.2.7
  'uuid@<11.1.1': 11.1.1

allowBuilds:
  '@biomejs/biome': true
  '@firebase/util': true
  '@swc/core': true
  esbuild: true
  oracledb: true
  protobufjs: true

onlyBuiltDependencies:
  - '@biomejs/biome'
  - '@firebase/util'
  - '@swc/core'
  - esbuild
  - protobufjs
