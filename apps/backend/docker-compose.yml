services:
  db:
    image: ${DBIMG}
    container_name: ${DBHOST}
    ports:
      - ${DBPORT}:5432
    volumes:
      - ./.volumes/db:/var/lib/postgresql/data
    restart: always
    environment:
      POSTGRES_USER: ${DBUSER}
      POSTGRES_PASSWORD: ${DBPASS}
      POSTGRES_DB: ${DBNAME}

  cache:
    image: ${CACHEIMG}
    container_name: ${CACHEHOST}
    ports:
      - ${CACHEPORT}:6379
    volumes:
      - ./.volumes/cache:/data
    restart: always
    environment:
      REDIS_ARGS: |
        --requirepass ${CACHEPASS}
        --loglevel notice

  vector:
    image: ${VECTORIMG}
    container_name: ${VECTORHOST}
    ports:
      - ${VECTORPORT_HTTP}:6333
      - ${VECTORPORT_GRPC}:6334
    volumes:
      - ./.volumes/vector:/qdrant/storage
    restart: always
    environment:
      - QDRANT__SERVICE__API_KEY=${VECTORTOKEN}
      - QDRANT__LOG_LEVEL=INFO

  ministack:
    image: ${MINISTACKIMG}
    container_name: ${MINISTACKHOST}
    ports:
      - 4566:4566
    volumes:
      - ./.volumes/ministack:/var/lib/ministack
      # MiniStack honours the LocalStack-compat init path; do not rename.
      - ./scripts/ministack-init:/etc/localstack/init/ready.d
    restart: always
    environment:
      - MINISTACK_REGION=us-east-1
      - PERSIST_STATE=1
      - S3_PERSIST=1
      - VOGAL_STORAGE_S3_BUCKET=${VOGAL_STORAGE_S3_BUCKET}
